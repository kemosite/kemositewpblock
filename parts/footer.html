<dialog id="accessibilityModal">

  <form>

  	<p>This model will contain accessibility preferences.</p>
  	
  	<p>Reduce red light:<br>
  	<div class="switch">
		<input class="switch-input" id="reduceRedRadioSwitch" type="radio" name="reduceLightGroup">
		<label class="switch-paddle" for="reduceRedRadioSwitch">
			<span class="show-for-sr">Reduce red light</span>
		</label>
	</div>
	</p>

	<p>Reduce blue light:<br>
	<div class="switch">
		<input class="switch-input" id="reduceBlueRadioSwitch" type="radio" name="reduceLightGroup">
		<label class="switch-paddle" for="reduceBlueRadioSwitch">
			<span class="show-for-sr">Reduce blue light</span>
		</label>
	</div>
	</p>

	<input type="reset" value="Reset">

  </form>

  <button id="closeAccessibilityModal" autofocus>Close</button>

</dialog>
